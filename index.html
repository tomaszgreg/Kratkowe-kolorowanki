<style>
:root{
  --paper:#F5F7FB; --grid:#E0E6EF; --card:#FFFFFF; --ink:#1B2640; --muted:#58647C;
  --line:#D3DBE7; --pen:#2350C4; --pen-ink:#FFFFFF; --marker:#FFD23F; --marker-ink:#1B2640;
  --shadow:0 1px 2px rgba(27,38,64,.06),0 8px 28px rgba(27,38,64,.10);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111726; --grid:#1B2437; --card:#172033; --ink:#E5EAF4; --muted:#9AA6BE;
    --line:#2A3650; --pen:#7FA0FF; --pen-ink:#0E1422; --marker:#F2C94C; --marker-ink:#171A22;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111726; --grid:#1B2437; --card:#172033; --ink:#E5EAF4; --muted:#9AA6BE;
  --line:#2A3650; --pen:#7FA0FF; --pen-ink:#0E1422; --marker:#F2C94C; --marker-ink:#171A22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;
  padding-inline:16px; padding-block:24px 48px;
}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.2vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 span{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 88%,transparent 88%);padding-inline:2px}
.top p{margin:0;color:var(--muted);max-width:60ch;flex:1 1 320px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card);margin-left:auto;align-self:center}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--body);letter-spacing:.04em;padding:4px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--pen);color:var(--pen-ink)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sec{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h2{margin:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;display:flex;align-items:center;gap:8px}
.sec h2 b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--pen);color:var(--pen-ink);font-family:var(--body);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--paper)}
.seg button{border:0;background:transparent;color:var(--muted);font:500 14px var(--body);padding:7px 8px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.themes{display:flex;flex-direction:column;gap:8px}
.ttabs{display:flex;flex-wrap:wrap;gap:4px}
.ttab{border:1px solid var(--line);background:transparent;color:var(--muted);font:500 13px var(--body);padding:4px 10px;border-radius:999px;cursor:pointer}
.ttab:hover{border-color:var(--pen);color:var(--ink)}
.ttab[aria-selected="true"]{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.theme-row.single{grid-template-columns:1fr}
.theme-row{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px}
.theme-row small{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;font-family:"Noto Color Emoji",sans-serif}
.chip img{width:34px;height:34px;object-fit:contain}
.chip:hover{border-color:var(--pen)}
.chip[aria-pressed="true"]{background:var(--marker);border-color:var(--marker)}
.row{display:flex;gap:8px;align-items:center}
input[type=text],select{width:100%;font:15px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
input[type=text]:focus-visible,select:focus-visible,button:focus-visible,.drop:focus-within{outline:2px solid var(--pen);outline-offset:2px}
#emojiInput{width:84px;font-size:22px;text-align:center;padding:4px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px 14px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;transition:border-color .15s}
.drop.over{border-color:var(--pen);color:var(--ink)}
.drop strong{color:var(--ink);font-weight:600}
.drop img{max-height:90px;border-radius:6px}
.hint{font-size:13px;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{display:flex;justify-content:space-between;font-weight:500;font-size:14px}
.field label output{font-variant-numeric:tabular-nums;color:var(--pen);font-weight:600}
input[type=range]{width:100%;accent-color:var(--pen)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px var(--body);cursor:pointer;background:var(--pen);color:var(--pen-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.preview{display:flex;flex-direction:column;gap:12px;min-width:0}
.pbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.pbar .seg{min-width:260px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.sheet{background:#fff;border-radius:6px;box-shadow:var(--shadow);width:100%;max-width:820px;aspect-ratio:1654/2339;display:block;align-self:center}
.warn{margin:0;max-width:820px;align-self:center;width:100%;background:var(--card);border:1px solid var(--marker);border-left:6px solid var(--marker);border-radius:10px;padding:10px 14px;font-size:14px}
.foot{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
.foot p{margin:0;max-width:95ch}
.foot strong{color:var(--ink);font-weight:600}
.foot a{color:var(--pen)}
.printonly{display:none}
.save{font-size:13px;color:var(--muted);max-width:820px;align-self:center;margin:0;text-align:center}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  .top,.panel,.pbar,.save,.foot,.warn,.sheet{display:none!important}
  .printonly{display:block;width:100%}
  .layout{display:block}
  .sheet{box-shadow:none;max-width:none;width:100%;border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

            <option value="mul100" data-i18n="L_mul100"></option>
            <option value="mix100" selected data-i18n="L_mix100"></option>
            <option value="add1000" data-i18n="L_add1000"></option>

        <div class="field">
          <label for="per" data-i18n="perLabel"></label>

        <div class="field">
          <label for="font"><span data-i18n="fontLabel"></span> <output id="fontOut">100%</output></label>

        </div>
      </div>
    </aside>

    <section class="preview">
      <div class="pbar">
        <div class="seg" role="group" data-i18n-aria="viewAria">

  </footer>
</div>

const LIN=new Float32Array(256).map((_,i)=>{const v=i/255;return v>0.04045?Math.pow((v+0.055)/1.055,2.4):v/12.92});

/* k-means++ in Lab: finds the colours that really make up the picture, small details included */
function kmeans(lab,N,K,pool){

    pixLab(f(px[i*4]),f(px[i*4+1]),f(px[i*4+2]),lab,i*3);
  }
  if(transparent<N*0.02){ // no transparency: flood the edge colour inwards if the border is uniform
    const border=[];for(let x=0;x<W;x++){border.push(x,(H-1)*W+x)}for(let y=0;y<H;y++){border.push(y*W,y*W+W-1)}
    const ref=[0,0,0];border.forEach(i=>{ref[0]+=lab[i*3];ref[1]+=lab[i*3+1];ref[2]+=lab[i*3+2]});ref.forEach((v,k)=>ref[k]=v/border.length);
    const near=i=>{const a=lab[i*3]-ref[0],b=lab[i*3+1]-ref[1],e=lab[i*3+2]-ref[2];return a*a+b*b+e*e<225};
    if(border.filter(near).length>border.length*0.8){
      const q=border.filter(near);q.forEach(i=>bg[i]=1);
      while(q.length){const i=q.pop(),x=i%W,y=(i-x)/W;
        for(const j of [x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1]){if(j>=0&&!bg[j]&&near(j)){bg[j]=1;q.push(j)}}}
    }
  }
  const obj=[];for(let i=0;i<N;i++)if(!bg[i])obj.push(i);
  const Kobj=Math.max(1,state.ncolors-1);
  const cent=kmeans(lab,N,Kobj,obj),K=cent.length;
  const cells=rows*cols,counts=new Float32Array(cells*K),cover=new Float32Array(cells),share=new Float64Array(K);
  for(const i of obj){
    const x=i%W,y=(i-x)/W;let bi=0,bd=Infinity;
    for(let k=0;k<K;k++){const a=lab[i*3]-cent[k][0],b=lab[i*3+1]-cent[k][1],e=lab[i*3+2]-cent[k][2],d=a*a+b*b+e*e;if(d<bd){bd=d;bi=k}}
    const q=Math.floor(y/P)*cols+Math.floor(x/P);counts[q*K+bi]++;cover[q]++;share[bi]++;
  }
  const BG=K,idx=new Int32Array(cells);
  for(let q=0;q<cells;q++){
    if(cover[q]<P*P*0.35){idx[q]=BG;continue}
    let bk=0;for(let k=1;k<K;k++)if(counts[q*K+k]>counts[q*K+bk])bk=k;idx[q]=bk;
  }
  const used=new Int32Array(K+1);idx.forEach(k=>used[k]++);
  for(let k=0;k<K;k++){ // rescue small details
    if(used[k]||share[k]/Math.max(1,obj.length)<0.004)continue;
    let best=-1,bf=0;
    for(let q=0;q<cells;q++){const f=counts[q*K+k]/(P*P);if(f>=0.3&&idx[q]!==BG){used[idx[q]]--;idx[q]=k;used[k]++}if(f>bf){bf=f;best=q}}
    if(!used[k]&&best>=0&&bf>=0.15){used[idx[best]]--;idx[best]=k;used[k]++}
  }
  const bgCrayon=CRAYONS.findIndex(cr=>cr.name===state.bg);
  const order=[...Array(K).keys()].filter(k=>used[k]).sort((a,b)=>used[b]-used[a]);
  const pairs=[];order.forEach(k=>CRAYONS.forEach((cr,j)=>{if(j!==bgCrayon||state.bg==='biały')pairs.push([crayonDist(cent[k],cr.lab),k,j])}));
  pairs.sort((a,b)=>a[0]-b[0]);
  // a white background stays white; a white object may also stay white (it is simply left uncoloured)
  const crayonOf=new Map(),taken=new Set(state.bg==='biały'?[]:[bgCrayon]);
  for(const [,k,j] of pairs){if(crayonOf.has(k)||taken.has(j))continue;crayonOf.set(k,j);taken.add(j)}
  const palette=order.map(k=>CRAYONS[crayonOf.get(k)]);
  const remap=new Map(order.map((k,i)=>[k,i]));
  if(used[BG]){remap.set(BG,palette.length);palette.push({...CRAYONS[bgCrayon],isBg:true})}
  return {rows,cols,idx:Array.from(idx,k=>remap.get(k)),palette,mono:s.mono};
}

/* ---------- maths ---------- */
function pool(level){
  const out=new Set();
  if(level==='add20')for(let i=1;i<=20;i++)out.add(i);
  if(level==='add50')for(let i=3;i<=50;i++)out.add(i);
  if(level==='add100')for(let i=11;i<=99;i++)out.add(i);
  if(level==='mix100')for(let i=2;i<=100;i++)out.add(i);
  if(level==='add1000')for(let i=110;i<=990;i+=10)out.add(i);
  if(level==='mul100'){for(let a=2;a<=10;a++)for(let b=2;b<=10;b++)out.add(a*b);for(let i=2;i<=10;i++)out.add(i)}
  return [...out];
}
function factors(n){const f=[];for(let a=2;a<=10;a++)if(n%a===0&&n/a>=2&&n/a<=10)f.push([a,n/a]);return f}
function makeEq(ans,level,r){
  const opts=[];
  if(level==='add1000'){
    const t=ans/10;
    if(t>=2)opts.push(()=>{const a=ri(r,1,t-1)*10;return `${a}+${ans-a}`});
    if(t<99)opts.push(()=>{const m=ri(r,t+1,Math.min(100,t+70))*10;return `${m}−${m-ans}`});
    return opts[Math.floor(r()*opts.length)]();
  }
  const MAX=level==='add20'?20:level==='add50'?50:100, small=MAX<=20;
  const addOnly=level.startsWith('add');
  const addOk=level!=='mul100'&&ans>=(small?2:4), subOk=level!=='mul100'&&ans<=MAX-(small?1:3);
  const mulOk=!addOnly&&factors(ans).length>0, divOk=!addOnly&&ans>=2&&ans<=10;
  if(addOk)opts.push(()=>{const lo=small?1:Math.max(2,Math.round(ans*0.15)),hi=small?ans-1:ans-2;const a=ri(r,lo,hi);return `${a}+${ans-a}`});
  if(subOk)opts.push(()=>{const m=ri(r,ans+(small?1:2),Math.min(MAX,ans+60));return `${m}−${m-ans}`});
  if(mulOk){const f=()=>{const fs=factors(ans);const [a,b]=fs[Math.floor(r()*fs.length)];return r()<.5?`${a}·${b}`:`${b}·${a}`};opts.push(f);if(level==='mix100')opts.push(f)}
  if(divOk)opts.push(()=>{const d=ri(r,2,10);return `${ans*d}:${d}`});
  if(!opts.length)return `${ans}+0`;
  return opts[Math.floor(r()*opts.length)]();
}
function assignMath(g,R){
  const r=rng(state.seed);
  const K=g.palette.length;
  const p=shuffle(pool(state.level),r);
  const per=Math.max(1,Math.min(state.per,Math.floor(p.length/K)));
  const answers=g.palette.map((_,k)=>p.slice(k*per,k*per+per).sort((a,b)=>a-b));
  R.regions.forEach(reg=>{
    // a one-square field shows the number itself: prefer answers of at most two digits there (100 sticks out of the square)
    const all=answers[reg.color],short=all.filter(v=>v<100);
    const a=reg.span===1&&short.length?short:all;
    reg.ans=a[Math.floor(r()*a.length)];reg.eq=reg.span>=2?makeEq(reg.ans,state.level,r):String(reg.ans)});
  return answers;
}

/* ---------- render ---------- */
const PW=1654,PH=2339,M=110,INK='#1B2640';
const FB='Lexend,"Segoe UI",Arial,sans-serif', FD='"Baloo 2","Trebuchet MS",Arial,sans-serif';
function luminance([r,g,b]){return (0.299*r+0.587*g+0.114*b)/255}

function render(g,R,answers,mode){
  const cv=document.createElement('canvas');cv.width=PW;cv.height=PH;
  const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,PW,PH);
  const key=mode==='key';
  // header
  x.fillStyle=INK;x.textBaseline='alphabetic';x.textAlign='left';
  x.font=`800 68px ${FD}`;
  let title=state.title.trim()||t('defaultTitle');if(key)title+=t('keySuffix');
  while(x.measureText(title).width>PW-2*M&&title.length>4)title=title.slice(0,-2)+'…';
  x.fillText(title,M,M+52);
  x.font=`400 30px ${FB}`;x.fillStyle='#4A5670';
  x.fillText(key?t('keySub'):t('instr'),M,M+106);
  if(!key){
    x.font=`500 30px ${FB}`;x.fillStyle=INK;
    x.fillText(t('name'),M,M+170);
    x.strokeStyle='#9AA3B5';x.lineWidth=2;x.beginPath();x.moveTo(M+92,M+174);x.lineTo(M+700,M+174);x.stroke();
    x.fillText(t('date'),M+760,M+170);
    x.beginPath();x.moveTo(M+850,M+174);x.lineTo(PW-M,M+174);x.stroke();
  }
  // legend size
  const K=g.palette.length, lcols=K>4?2:1, lrows=Math.ceil(K/lcols), rowH=80;
  const legendH=70+lrows*rowH;
  const gridTop=M+220, gridBottomMax=PH-M-legendH-40;
  const cell=Math.floor(Math.min((PW-2*M)/g.cols,(gridBottomMax-gridTop)/g.rows));
  const gw=cell*g.cols,gh=cell*g.rows,gx=Math.round((PW-gw)/2),gy=gridTop;
  // fills
  if(key){g.idx.forEach((ci,k)=>{x.fillStyle=g.palette[ci].hex;x.fillRect(gx+(k%g.cols)*cell,gy+Math.floor(k/g.cols)*cell,cell,cell)})}
  // thin inner lines
  x.strokeStyle=key?'rgba(27,38,64,.18)':'#C9D1DD';x.lineWidth=1.5;x.beginPath();
  for(let c=1;c<g.cols;c++){x.moveTo(gx+c*cell,gy);x.lineTo(gx+c*cell,gy+gh)}
  for(let r=1;r<g.rows;r++){x.moveTo(gx,gy+r*cell);x.lineTo(gx+gw,gy+r*cell)}
  x.stroke();
  // region borders
  x.strokeStyle=INK;x.lineWidth=Math.max(3,cell*0.05);x.lineCap='round';x.beginPath();
  const reg=R.reg;
  for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
    const k=r*g.cols+c;
    if(c<g.cols-1&&reg[k]!==reg[k+1]){x.moveTo(gx+(c+1)*cell,gy+r*cell);x.lineTo(gx+(c+1)*cell,gy+(r+1)*cell)}
    if(r<g.rows-1&&reg[k]!==reg[k+g.cols]){x.moveTo(gx+c*cell,gy+(r+1)*cell);x.lineTo(gx+(c+1)*cell,gy+(r+1)*cell)}
  }
  x.stroke();
  x.lineWidth=Math.max(4,cell*0.07);x.strokeRect(gx,gy,gw,gh);
  // equations
  x.textAlign='center';x.textBaseline='middle';
  // one size for all equations (they get two cells) and a bigger one for lone numbers
  const fit=(list,w,start)=>{let f=start;x.font=`600 ${f}px ${FB}`;const wd=list.reduce((m,t)=>Math.max(m,x.measureText(t).width),0);if(wd>w)f=Math.max(9,Math.floor(f*w/wd));return f};
  const eqs=R.regions.filter(r=>r.span>=2).map(r=>r.eq),nums=R.regions.filter(r=>r.span===1).map(r=>r.eq);
  const PT=Math.round(PW/210*25.4/72); // 1 typographic point at the sheet's resolution
  const start=Math.floor(cell*0.5)+PT;
  let fsAll=Math.min(fit(eqs,cell*1.9,start),fit(nums,cell*0.95,start)); // one size for everything
  const fsEq=fsAll,fsNum=fsAll;
  fsAll=Math.max(4,Math.round(fsAll*fontScale()));
  x.font=`600 ${fsAll}px ${FB}`; // one font for every field (setting it per field is slow)
  let nEq=0,nNum=0;
  R.regions.forEach(rg=>{
    const k=rg.label,cx=gx+(k%g.cols+rg.span/2)*cell,cy=gy+(Math.floor(k/g.cols)+0.5)*cell;
    const fs=fsAll;
    let txt=rg.eq;
    // an equation wider than its field is replaced by its answer
    if(rg.span>=2&&x.measureText(txt).width>rg.span*cell*0.94)txt=String(rg.ans);
    if(txt===rg.eq&&rg.span>=2)nEq++;else nNum++;
    if(key){const dark=luminance(g.palette[rg.color].rgb)<0.45;x.fillStyle=dark?'rgba(255,255,255,.7)':'rgba(27,38,64,.55)'}
    else x.fillStyle=INK;
    x.fillText(txt,cx,cy+fs*0.04);
  });
  // legend
  const ly=gy+gh+50;
  x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle=INK;x.font=`800 40px ${FD}`;
  x.fillText(t('legend'),M,ly+36);
  const colW=(PW-2*M)/lcols;
  g.palette.forEach((p,i)=>{
    const col=Math.floor(i/lrows),row=i%lrows;
    const lx=M+col*colW,yy=ly+70+row*rowH;
    x.fillStyle=p.hex;x.strokeStyle=INK;x.lineWidth=3;
    x.beginPath();x.roundRect?x.roundRect(lx,yy,60,52,10):x.rect(lx,yy,60,52);x.fill();x.stroke();
    x.fillStyle=INK;x.textBaseline='middle';
    x.font=`600 32px ${FB}`;const pn=crayonLabel(p);x.fillText(pn,lx+80,yy+26);
    const nw=x.measureText(pn).width;
    x.font=`500 32px ${FB}`;x.fillStyle='#34405A';
    x.fillText('→  '+answers[i].join(',  '),lx+80+Math.max(nw+24,230),yy+26);
    x.textBaseline='alphabetic';
  });
  return {cv,cell,nEq,nNum};
}

// font slider: position 0–100 maps logarithmically to 10%–1000% (50 = 100%, the size that fits the fields)
const fontPct=v=>{const p=10*Math.pow(100,v/100);return p<30?Math.round(p):p<200?Math.round(p/5)*5:Math.round(p/10)*10};
const fontScale=()=>fontPct(state.font)/100;

/* ---------- pipeline ----------
   Speed: the picture analysis and the regions are cached and recomputed only when their inputs change;
   only the sheet on screen is drawn and encoded, the other one on demand; stale runs are dropped. */
let timer=null,gen=0,views={},cur=null,gridCache=null,regCache=null;
function toURL(cv){return new Promise(res=>cv.toBlob(b=>res(URL.createObjectURL(b)),'image/png'))}
function dropViews(){Object.values(views).forEach(v=>v.url&&URL.revokeObjectURL(v.url));views={}}
function view(v){ // canvas for 'student' or 'key', drawn when first needed
  if(!views[v])views[v]=render(cur.g,cur.R,cur.answers,v);
  return views[v];
}
async function viewURL(v){const w=view(v);if(!w.url)w.url=await toURL(w.cv);return w.url}
async function regenerate(){
  const my=++gen;
  if(state.src.type==='image'&&!state.img)return;
  if(state.src.type==='emoji'&&document.fonts){await Promise.race([document.fonts.load(`360px "Noto Color Emoji"`,state.src.value).catch(()=>{}),new Promise(r=>setTimeout(r,3000))]);if(my!==gen)return}
  const notoOk=state.src.type!=='emoji'||!document.fonts||document.fonts.check(`360px "Noto Color Emoji"`,state.src.value);
  const gKey=[srcId(),state.cols,state.ncolors,state.algo,state.algo==='shape'?state.bg:''].join('|');
  if(!gridCache||gridCache.key!==gKey){gridCache={key:gKey,g:state.algo==='shape'?buildGridShape():buildGrid()};regCache=null}
  const g=gridCache.g;
  const rKey=gKey+'|'+state.region;
  if(!regCache||regCache.key!==rKey)regCache={key:rKey,R:buildRegions(g)};
  const R=regCache.R;
  const answers=assignMath(g,R);
  dropViews();cur={g,R,answers};
  const url=await viewURL(state.view);
  if(my!==gen)return;
  $('#sheet').src=url;$('#sheet').alt=state.view==='key'?t('altKey'):t('altStudent');
  const mm=(view(state.view).cell/PW*210).toFixed(0);
  const warn=$('#warn');
  if(!notoOk){warn.textContent=t('wNoto');warn.hidden=false}
  else if(g.mono){warn.textContent=t('wMono');warn.hidden=false}
  else if(g.palette.length<state.ncolors){warn.textContent=t('wFew')(g.palette.length,state.ncolors);warn.hidden=false}
  else warn.hidden=true;
  const vw=view(state.view);
  $('#stats').innerHTML=`<span class="pill"><b>${vw.nEq}</b> ${t('stProblems')}</span><span class="pill"><b>${vw.nNum}</b> ${t('stNumbers')}</span><span class="pill"><b>${g.cols}×${g.rows}</b> ${t('stSquares')}</span><span class="pill">${t('stSize')} <b>${mm} mm</b></span><span class="pill">${t('S_'+state.level)}</span>`;
}
function schedule(){clearTimeout(timer);timer=setTimeout(regenerate,120)}
async function showView(){
  if(!cur)return;const my=gen;
  const url=await viewURL(state.view);if(my!==gen)return;
  $('#sheet').src=url;$('#sheet').alt=state.view==='key'?t('altKey'):t('altStudent');
}

let downloadsP=null;
try{downloadsP=window.claude?.use?window.claude.use('downloads'):null}catch(e){downloadsP=null}
async function savePdf(onlySheet){
  const btn=onlySheet?$('#pdf1Btn'):$('#pdfBtn'),warn=$('#warn');
  if(!cur||!window.jspdf){warn.textContent=t('wPdf');warn.hidden=false;return}
  btn.disabled=true;const old=btn.textContent;btn.textContent=t('preparing');
  try{
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    doc.addImage(view('student').cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
    if(!onlySheet){
      doc.addPage();
      doc.addImage(view('key').cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
    }
    const name=((state.title||t('fileBase')).trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'-').toLowerCase()||t('fileBase'))+'.pdf';
    const dl=downloadsP?await downloadsP:null;
    if(dl){
      try{await dl.save({filename:name,data:doc.output('blob')})}
      catch(e){if(e&&e.code!=='declined'){warn.textContent=t('wPdfSave');warn.hidden=false}}
    }else if(!framed){doc.save(name)}
    else{warn.textContent=t('wPdfBlocked');warn.hidden=false}
  }finally{btn.disabled=false;btn.textContent=old}
}
$('#pdfBtn').onclick=()=>savePdf(false);
$('#pdf1Btn').onclick=()=>savePdf(true);

// Printing works only when the page is opened directly (not inside the artifact frame)
let framed=true;try{framed=window.self!==window.top}catch(e){framed=true}
async function printSheet(){ // always the pupil sheet, whatever is on screen
  if(!cur)return;
  const im=$('#printImg');im.src=await viewURL('student');
  try{await im.decode()}catch(e){}
  window.print();
}
// Inside the artifact viewer the browser's print dialog is blocked, so there "Print" saves a one-page PDF to print instead.
$('#printBtn').onclick=()=>{
  if(!framed){printSheet();return}
  const w=$('#warn');w.textContent=t('printFramed');w.hidden=false;savePdf(true);
};
if(!framed){$('#saveHint').dataset.i18n='saveHintLocal';$('#saveHint').textContent=t('saveHintLocal')}

const fontsReady=document.fonts?Promise.all([document.fonts.load(`800 68px "Baloo 2"`),document.fonts.load(`600 30px Lexend`),document.fonts.load(`500 30px Lexend`),document.fonts.load(`400 30px Lexend`)]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(regenerate);
})();
</script>
